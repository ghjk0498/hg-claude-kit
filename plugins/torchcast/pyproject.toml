[project]
name = "torchcast-mcp"
version = "0.1.0"
description = "torchcast 판단 API를 감싼 MCP 분류 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
]

[project.scripts]
torchcast-mcp = "torchcast_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
